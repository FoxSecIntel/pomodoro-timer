<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #1f2937;
      --surface-soft: #263244;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --emerald: #10b981;
      --coral: #ef4444;
      --ring-track: #374151;
      --btn: #2f3d52;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 368px;
      background: radial-gradient(circle at top right, #111827 0%, #0b0e14 60%);
      color: var(--text);
      font-family: Inter, Montserrat, Segoe UI, Arial, sans-serif;
      padding: 12px;
    }

    .app {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--surface);
      border: 1px solid #344255;
      border-radius: 8px;
      padding: 10px;
    }

    .modes, .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button, input[type='number'] {
      border-radius: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    button {
      background: var(--btn);
      color: var(--text);
      border: 1px solid #44556d;
      font-size: 13px;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { filter: brightness(1.1); }
    button:active { transform: scale(0.96); }
    button:disabled {
      opacity: 0.55;
      cursor: default;
      filter: none;
    }

    button.active {
      border-color: var(--emerald);
      box-shadow: 0 0 0 1px #10b98155 inset;
    }

    .timer-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .timer-shell {
      position: relative;
      width: 190px;
      height: 190px;
      display: grid;
      place-items: center;
    }

    .ring {
      width: 190px;
      height: 190px;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--ring-track);
      stroke-width: 10;
    }

    .ring-fill {
      fill: none;
      stroke: var(--emerald);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 534;
      stroke-dashoffset: 534;
      transition: stroke-dashoffset 0.2s ease, stroke 0.2s ease;
    }

    .timer-core {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      background: #111827;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid #2e3b4f;
    }

    #time {
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.5px;
      color: var(--emerald);
      transition: all 0.2s ease;
    }

    #time.running {
      animation: breathe 1.8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { text-shadow: 0 0 6px #10b98155; }
      50% { text-shadow: 0 0 16px #10b981aa; }
    }

    .meta-inline {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      text-transform: capitalize;
    }

    .rows {
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
    }

    .row label {
      font-size: 13px;
      color: var(--muted);
    }

    input[type='number'] {
      width: 68px;
      background: #111827;
      border: 1px solid #415169;
      color: var(--text);
      padding: 6px 8px;
      font-size: 14px;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .meta {
      border-top: 1px solid #334155;
      margin-top: 8px;
      padding-top: 8px;
      display: grid;
      gap: 4px;
      font-size: 12px;
    }

    #cycleCount.pulse {
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0% { transform: scale(1); color: var(--text); }
      50% { transform: scale(1.06); color: var(--emerald); }
      100% { transform: scale(1); color: var(--text); }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card modes">
      <button id="focusBtn" class="active">Focus</button>
      <button id="shortBreakBtn">Short break</button>
      <button id="longBreakBtn">Long break</button>
    </section>

    <section class="card timer-wrap">
      <div class="timer-shell">
        <svg class="ring" viewBox="0 0 190 190" aria-hidden="true">
          <circle class="ring-track" cx="95" cy="95" r="85"></circle>
          <circle id="ringFill" class="ring-fill" cx="95" cy="95" r="85"></circle>
        </svg>
        <div class="timer-core">
          <div id="time">20:00</div>
          <div id="modeLabel" class="meta-inline">Focus</div>
        </div>
      </div>
    </section>

    <section class="card controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
      <button id="resetBtn">Reset</button>
    </section>

    <section class="card rows">
      <div class="row">
        <label for="focusMinutes">Focus min</label>
        <input id="focusMinutes" type="number" min="1" max="120" value="20" />
        <span></span>
      </div>
      <div class="row">
        <label for="shortBreakMinutes">Short break</label>
        <input id="shortBreakMinutes" type="number" min="1" max="60" value="5" />
        <span></span>
      </div>
      <div class="row">
        <label for="longBreakMinutes">Long break</label>
        <input id="longBreakMinutes" type="number" min="5" max="120" value="15" />
        <button id="applyBtn">Apply</button>
      </div>
      <div id="status" class="status">Mode: focus | Paused</div>
      <div class="meta">
        <div id="cycleCount">Completed focus sessions: 0</div>
        <div id="nextPhase">Next: short break</div>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
